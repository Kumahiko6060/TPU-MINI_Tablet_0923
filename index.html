<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TPU-MINI 手書きモード</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden; /* ページ自体はスクロールさせない。スクロールするのはCanvas領域の横方向のみ */
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #111318;
    color: #eee;
  }
  body {
    display: flex;
    flex-direction: column; /* ヘッダー(可変高さ)+Canvas領域(残り全部)を縦積みにする */
  }
  #header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex: 0 0 auto;
    padding: 8px 10px;
    background: #1a1c22;
    border-bottom: 1px solid #2a2d38;
  }
  #header h1 {
    font-size: 14px;
    margin: 0 10px 0 0;
    white-space: nowrap;
  }
  button {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #23262f;
    color: #eee;
  }
  button.primary { background: #2f6fed; border-color: #2f6fed; }
  button.danger { background: #4a2323; border-color: #7a3a3a; }
  button.active { background: #7a5a12; border-color: #c98a1a; }
  button:disabled { opacity: 0.4; }
  select {
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1a1c22;
    color: #eee;
  }
  .status {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status.connected { background: #163d24; color: #4ade80; }
  .status.disconnected { background: #3d1a1a; color: #f87171; }
  #liveInfo {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }
  #blockCount {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
    margin-left: auto;
  }
  #sendStatus {
    flex: 0 0 auto;
    font-size: 11px;
    color: #888;
    padding: 4px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #canvasArea {
    flex: 1 1 auto; /* ヘッダー/ステータス行の残り高さを丸ごと使う */
    position: relative;
    min-height: 0; /* flexアイテムの縮小を正しく効かせるために必要 */
  }
  #scrollWrap {
    position: absolute;
    inset: 0;
    overflow-x: auto;  /* ★"hidden"ではなく"auto"にしておく必要がある。iOS Safariでは
                            overflow:hiddenな要素へのJSでのscrollLeft代入が反映されないことが
                            あるため(横スクロールはネイティブに任せず、下記の2本指パンで
                            JSがscrollLeftを直接操作する)。 */
    overflow-y: hidden;
  }
  #pagesRow {
    display: flex;
    height: 100%;
  }
  .page-canvas {
    display: block;
    flex: 0 0 auto;
    background: #ffffff; /* Canvas自体は紙のイメージで常に白 */
    touch-action: none; /* 指の挙動(1本指=描画/2本指=パン)は全てJS側で判定・処理する */
    border-right: 2px solid #cfcfcf; /* 画面(ページ)の区切り */
  }
</style>
</head>
<body>

<div id="header">
  <h1>TPU-MINI 手書き</h1>
  <button id="connectBtn" class="primary">接続</button>
  <span id="connStatus" class="status disconnected">未接続</span>
  <span id="liveInfo">--.- kPa / MODE: -</span>
  <select id="wheelOrder">
    <option value="0">FL始点</option>
    <option value="1">FR始点</option>
    <option value="2">RL始点</option>
    <option value="3">RL始点・逆</option>
    <option value="4">RR始点</option>
  </select>
  <span id="blockCount">0/50</span>
  <button id="newBtn" class="danger">新規</button>
  <button id="sendBtn" class="primary">送信</button>
</div>
<div id="sendStatus"></div>

<div id="canvasArea">
  <div id="scrollWrap">
    <div id="pagesRow"></div>
  </div>
</div>

<script>
// =================================================================
// TPU-MINI 手書きモード用 Webアプリ(第2版: ページ分割Canvas方式)
//
// ★通常モード(tpu_mini_app.html、数値のみGAS送信)とは別ファイルとして分離。
//   モード切替をアプリ内に持たせるとコードが長くなるため、あえて別アプリにしている。
//   BLEのUUID・接続処理・測定順テーブルは通常モードと同じものをそのまま流用。
//
// ★設計方針の要点(会話で決めた内容):
//   - 横スクロールの帯に、BLEで4輪確定するたびに「田」の字ブロック(4輪の値+確定時刻)を
//     自動で右へ追加していく。タブレット1画面幅あたり2ブロック、上半分に田の字の自動記入、
//     下半分を手書きエリアとする構成。
//   - 誤測定値の訂正はアプリ側の編集機能では行わず、送信機の表示を見ながら手書きで
//     直接訂正する運用を前提にしている(訂正専用のUIは用意していない)。
//   - 送信してもCanvasの内容はクリアされない(タイヤマンがずっと確認できるように)。
//     送信は担当者が任意のタイミングで押す想定で、その時点の全ページを1枚の画像に
//     まとめてGASへ送る。
//   - アプリを開き直しても、明示的に「新規」ボタンを押さない限り前回の続きから使える。
//     ブラウザのIndexedDBに各ページを画像として保存・復元する。
//   - 対象端末はiPad(Bluefy等が必要)・Androidタブレット両方、横向き(ランドスケープ)使用。
//
// ★第2版での変更点(重要):
//   初版は「50ブロック分(25画面分)の巨大な1枚のCanvas」を最初に丸ごと確保する設計
//   だったが、iPad実機(Safari標準/Bluefy/Chrome、いずれもWebKitベース)で検証したところ、
//   指での描画が効かないだけでなく、区切り線(本来Canvasに描いているはずの罫線)すら
//   表示されないという不具合が出た。PCでは正常に見えていたことから、iOS Safariの
//   Canvasサイズ上限(古い実装では概ね4096×4096=1670万px程度が目安とされる)を、
//   DPR込みの巨大な1枚Canvasが超えてしまい、WebKit側が描画バッファの確保自体に
//   失敗して「何も描かれない(エラーも出ない)」状態になっていた可能性が高いと判断した。
//
//   対策として、Canvasを「1画面(2ブロック)ごとに1枚」の小さなCanvas要素に分割し、
//   ブロックが増えるたびに必要な分だけ新しいページ用Canvasを追加で生成する方式に変更した。
//   1ページ分のCanvasは十分小さい(数百万px程度)ため、上限に達する心配がない。
//   複数のCanvas要素を横に並べる(displex:flexの行)ことで、見た目上は1本の帯として
//   スクロールできる。
//
// ★第3版での変更点:
//   第2版では横スクロールをJS側でscrollWrap.scrollLeftを直接操作する方式にしていたが、
//   iPad実機で「描画はできるようになったが、今度は横スクロールが効かない」という報告が
//   あった。試しにブラウザのネイティブ実装(touch-action:pan-x)に戻してみたが、それでも
//   改善しなかった。
//
// ★第4版での変更点(現在の方式):
//   1本指ドラッグの意図(描画かスクロールか)をtouch-actionやブラウザの挙動で判別させる
//   方式はiPad実機で安定しなかったため、「指の本数」という曖昧さのない基準に切り替えた。
//   指1本(またはペン/マウス)は常に描画、指2本以上は常にパン(横スクロール)、とJS側だけで
//   完全に判定する。これに伴い、以前あった「固定」ボタン(1本指の用途をON/OFFで切り替える
//   ためのもの)は不要になったため削除した。
//   横スクロールはscrollWrap.scrollLeftをJSで直接操作する(#scrollWrapはoverflow-x:auto。
//   overflow:hiddenにするとiOS SafariでscrollLeft代入が反映されないことがあるため要注意)。
//
// ★第5版での変更点(現在の方式):
//   第4版(指の本数で描画/パンを判定する方式)は、PC上のChromiumシミュレータでは
//   正常動作を確認したが、iPad実機(Chrome)で「1本指の描画は正常、2本目の指は
//   完全に無反応(パンも起きない)」という症状が出た。これはPointer Events APIの
//   マルチタッチ対応がWebKit(iOS Safari/Chrome/Bluefyは全てWebKitベース)で
//   不安定であることが既知の制約としてあり、Blink(Chromium)との実装差が原因と
//   判断した。
//   そこで、Pointer Eventsでのマルチタッチ判定をやめ、より古くから多点タッチで
//   安定しているTouch Events API(touchstart/touchmove/touchendとe.touches/
//   e.changedTouches)に切り替えた。指(touch)の描画・パン判定はTouch Events側で
//   完結させ、Pointer Eventsはマウス/ペン入力の描画専用として残している
//   (pointerType==="touch"の場合はPointer Events側では何もしない)。
//   判定方式自体(1本指=描画、2本目が触れたらパンに切替)は第4版から変更なし。
//
// ★未確認・要実機再確認の項目:
//   - 今回の修正(Touch Events方式)でiPad実機の2本指パンが直るかどうか。
//   - ページ分割によるCanvas描画・区切り線表示・1本指での手書きは前回までの修正で
//     改善済み(実機で確認取れた)。
//   - ブロック上限(50)に達した場合の挙動(現状は警告を出して以降の自動追記を止めるだけ)。
//   - 送信時、多数ページ(理論上最大25ページ)を1枚に結合する際のCanvasサイズ(結合用
//     Canvasはdpr=1固定で書き出しているが、それでも大きい場合は要調整)。
// =================================================================

const SERVICE_UUID        = "12345678-1234-5678-1234-56789abcdef0";
const LIVE_CHAR_UUID      = "12345678-1234-5678-1234-56789abcdef1";
const CONFIRMED_CHAR_UUID = "12345678-1234-5678-1234-56789abcdef2";
const MODE_CHAR_UUID      = "12345678-1234-5678-1234-56789abcdef3";

// ★通常モードと同じGAS Web Appをそのまま使う(手書き用のtype="handwriting"分岐は
//   既存doPost()側にgas_handwriting_addon.gsの内容を追記してある前提)。
const GAS_URL = "https://script.google.com/macros/s/AKfycbzVkPtrjLQHoI61LLRGcJu7mJ58D-VdpwrOCB4kXyT_W8gUPw28EHwf2Yksgl8IIH33/exec";

const WHEEL_ORDER_TABLE = [
  ["FL", "RL", "RR", "FR"],
  ["FR", "RR", "RL", "FL"],
  ["RL", "FL", "FR", "RR"],
  ["RL", "RR", "FR", "FL"],
  ["RR", "RL", "FL", "FR"],
];

const MAX_BLOCKS = 50;          // ★1セッション最大20〜30回の想定に余裕を持たせた上限
const BLOCKS_PER_PAGE = 2;      // ★タブレット1画面幅あたり2ブロック

const DB_NAME = "tpu_mini_handwriting_db";
const STORE_NAME = "state";
const STATE_KEY = "current";

const el = (id) => document.getElementById(id);
const textDecoder = new TextDecoder("utf-8");

let bleDevice = null;
let bleServer = null;
let lastKnownModeChar = "A";

let wheelValues = {};
let currentOrderIdx = 0;
let blockIndex = 0;

let scrollWrap, pagesRow;
let dpr = Math.min(window.devicePixelRatio || 1, 2); // ★DPRを最大2までに制限(Canvasサイズ上限対策)
let PAGE_W_CSS = 0, PAGE_H_CSS = 0, BLOCK_W_CSS = 0, GRID_H = 0;

let pages = []; // pages[pageIdx] = { canvas, ctx } ※実際に使われた分だけ生成する

// ★ペン/マウス用(Pointer Events)。指(touch)はここでは扱わない(下のTouch Events側で処理)。
let mode = null; // "draw" | null
let lastX = 0, lastY = 0;             // 描画時: 対象Canvas内座標(CSS px)
let activeCanvas = null, activeCtx = null; // 現在描画中のページCanvas

// ★指(touch)用(Touch Events)。1本指=描画、2本目が触れたらパンに切替。
let touchMode = null;      // "draw" | "pan" | null
let drawTouchId = null;    // 描画中の指のidentifier
let touchLastX = 0, touchLastY = 0;   // 描画時: 対象Canvas内座標(CSS px)
let touchActiveCanvas = null, touchActiveCtx = null;
let panTouchId = null;     // パン中、どの指の動きを基準にするか(identifier)
let panLastClientX = 0;    // パン時: 画面(viewport)基準のX座標

function currentWheelOrder() {
  return WHEEL_ORDER_TABLE[parseInt(el("wheelOrder").value, 10)];
}

function resetWheelCollector() {
  wheelValues = {};
  currentOrderIdx = 0;
  currentWheelOrder().forEach(w => wheelValues[w] = null);
}

function pageIndexOf(idx) { return Math.floor(idx / BLOCKS_PER_PAGE); }
function slotIndexOf(idx) { return idx % BLOCKS_PER_PAGE; }

// -----------------------------------------------------------------
// レイアウトの初期化(1画面=1ページの寸法を決める。以後変更しない)
// -----------------------------------------------------------------
function setupLayout() {
  scrollWrap = el("scrollWrap");
  pagesRow = el("pagesRow");
  PAGE_W_CSS = Math.max(600, Math.round(window.innerWidth));
  BLOCK_W_CSS = PAGE_W_CSS / BLOCKS_PER_PAGE;
  PAGE_H_CSS = Math.max(300, el("canvasArea").clientHeight);
  GRID_H = PAGE_H_CSS * 0.5;
}

function paintPageBackground(canvasEl, ctx) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
  ctx.restore();
}

function drawPageGuides(ctx) {
  ctx.save();
  // 2ブロックの境界(細線)
  ctx.strokeStyle = "#e5e5e5";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(BLOCK_W_CSS, 0);
  ctx.lineTo(BLOCK_W_CSS, PAGE_H_CSS);
  ctx.stroke();
  // 自動記入ゾーン(上半分)と手書きゾーン(下半分)の区切り
  ctx.strokeStyle = "#cfcfcf";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(0, GRID_H);
  ctx.lineTo(PAGE_W_CSS, GRID_H);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function attachPointerHandlers(canvasEl) {
  // マウス/ペン(Pointer Events)。指(touch)はここでは無視し、Touch Events側で処理する。
  canvasEl.addEventListener("pointerdown", (e) => onPointerDown(e, canvasEl));
  canvasEl.addEventListener("pointermove", onPointerMove);
  canvasEl.addEventListener("pointerup", onPointerEnd);
  canvasEl.addEventListener("pointercancel", onPointerEnd);
  canvasEl.addEventListener("pointerleave", onPointerEnd);
  // 指(touch, Touch Events)。WebKitでのPointer Eventsマルチタッチ不安定問題を避けるため。
  canvasEl.addEventListener("touchstart", (e) => onTouchStart(e, canvasEl), { passive: false });
  canvasEl.addEventListener("touchmove", (e) => onTouchMove(e, canvasEl), { passive: false });
  canvasEl.addEventListener("touchend", (e) => onTouchEnd(e, canvasEl), { passive: false });
  canvasEl.addEventListener("touchcancel", (e) => onTouchCancel(e, canvasEl), { passive: false });
}

function createPageCanvas(pageIdx) {
  const c = document.createElement("canvas");
  c.className = "page-canvas";
  c.style.width = PAGE_W_CSS + "px";
  c.style.height = PAGE_H_CSS + "px";
  c.width = Math.round(PAGE_W_CSS * dpr);
  c.height = Math.round(PAGE_H_CSS * dpr);
  // touch-actionはCSS(.page-canvas)で常にnone。指の挙動は全てJS側(onPointerDown等)で判定する。
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  pagesRow.appendChild(c);
  paintPageBackground(c, ctx);
  drawPageGuides(ctx);
  attachPointerHandlers(c);
  pages[pageIdx] = { canvas: c, ctx };
  return pages[pageIdx];
}

function getOrCreatePage(pageIdx) {
  if (!pages[pageIdx]) createPageCanvas(pageIdx);
  return pages[pageIdx];
}

function formatTimestamp(d) {
  const p2 = (n) => String(n).padStart(2, "0");
  return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}

// 「田」の字ブロックを1つ描く(4輪の値+確定時刻)。blockIdxからページと枠位置を割り出す。
function drawBlockAt(blockIdx, values, timestampStr) {
  const pageIdx = pageIndexOf(blockIdx);
  const slot = slotIndexOf(blockIdx);
  const page = getOrCreatePage(pageIdx);
  const ctx = page.ctx;

  const pad = 10;
  const x0 = slot * BLOCK_W_CSS;
  const gx = x0 + pad;
  const gy = pad;
  const gw = BLOCK_W_CSS - pad * 2;
  const gh = GRID_H - pad * 2 - 16; // 下に時刻を書くぶんを残す

  ctx.save();
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(gx, gy, gw, gh);
  ctx.beginPath();
  ctx.moveTo(gx + gw / 2, gy);
  ctx.lineTo(gx + gw / 2, gy + gh);
  ctx.moveTo(gx, gy + gh / 2);
  ctx.lineTo(gx + gw, gy + gh / 2);
  ctx.stroke();

  const cellW = gw / 2, cellH = gh / 2;
  const cells = [
    { label: "FL", cx: gx + cellW * 0.5, cy: gy + cellH * 0.5, val: values.FL },
    { label: "FR", cx: gx + cellW * 1.5, cy: gy + cellH * 0.5, val: values.FR },
    { label: "RL", cx: gx + cellW * 0.5, cy: gy + cellH * 1.5, val: values.RL },
    { label: "RR", cx: gx + cellW * 1.5, cy: gy + cellH * 1.5, val: values.RR },
  ];
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  cells.forEach(c => {
    ctx.fillStyle = "#999999";
    ctx.font = "11px sans-serif";
    ctx.fillText(c.label, c.cx, c.cy - 13);
    ctx.fillStyle = "#111111";
    ctx.font = "bold 17px sans-serif";
    ctx.fillText(c.val != null ? c.val.toFixed(1) : "--.-", c.cx, c.cy + 5);
  });

  ctx.fillStyle = "#666666";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(timestampStr, gx, gy + gh + 14);
  ctx.restore();
}

function updateBlockCountLabel() {
  el("blockCount").textContent = `${blockIndex}/${MAX_BLOCKS}`;
}

function onConfirmedValue(kpa) {
  const order = currentWheelOrder();
  if (currentOrderIdx >= order.length) return;
  const wheel = order[currentOrderIdx];
  wheelValues[wheel] = kpa;
  currentOrderIdx++;
  if (currentOrderIdx >= order.length) {
    if (blockIndex >= MAX_BLOCKS) {
      alert("本日の上限(" + MAX_BLOCKS + "ブロック)に達しました。「新規」で次のシートを開始してください。");
      resetWheelCollector();
      return;
    }
    const wasNearEnd = isScrollNearEnd();
    drawBlockAt(blockIndex, wheelValues, formatTimestamp(new Date()));
    blockIndex++;
    updateBlockCountLabel();
    resetWheelCollector();
    saveState();
    if (wasNearEnd) scrollToLatest();
  }
}

function isScrollNearEnd() {
  const maxScroll = scrollWrap.scrollWidth - scrollWrap.clientWidth;
  return (maxScroll - scrollWrap.scrollLeft) < PAGE_W_CSS * 0.75;
}

function scrollToLatest() {
  const pageIdx = pageIndexOf(Math.max(0, blockIndex - 1));
  const page = pages[pageIdx];
  if (!page) return;
  scrollWrap.scrollTo({ left: Math.max(0, page.canvas.offsetLeft), behavior: "smooth" });
}

// -----------------------------------------------------------------
// 手書き入力。
//   - ペン/マウス: Pointer Eventsで常に描画。
//   - 指(touch): Touch Eventsで判定する(WebKitはPointer Eventsのマルチタッチ対応が
//     不安定なため、指の扱いはTouch Events APIに分離した。第5版のコメント参照)。
//       1本: 描画。2本以上: パン(横スクロール)。2本目が触れた時点で、1本目による
//       描画中だった場合はそこで打ち切ってパンへ切り替える。
//   横スクロールはscrollWrap.scrollLeftを直接操作する(#scrollWrapがoverflow:autoなので
//   反映される。overflow:hiddenだと反映されないことがあるため注意)。
// -----------------------------------------------------------------
function getPos(clientX, clientY, canvasEl) {
  const rect = canvasEl.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function strokeLine(ctx, x0, y0, x1, y1) {
  ctx.save();
  ctx.strokeStyle = "#111111";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  ctx.restore();
}

function touchListFind(list, id) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].identifier === id) return list[i];
  }
  return null;
}

// --- ペン/マウス(Pointer Events)。指(touch)はここでは扱わない ---
function onPointerDown(e, canvasEl) {
  if (e.pointerType === "touch") return; // 指はTouch Events側で処理
  e.preventDefault();
  canvasEl.setPointerCapture(e.pointerId);
  mode = "draw";
  activeCanvas = canvasEl;
  activeCtx = canvasEl.getContext("2d");
  const p = getPos(e.clientX, e.clientY, canvasEl);
  lastX = p.x; lastY = p.y;
}

function onPointerMove(e) {
  if (e.pointerType === "touch") return;
  if (mode === "draw" && activeCtx) {
    e.preventDefault();
    const p = getPos(e.clientX, e.clientY, activeCanvas);
    strokeLine(activeCtx, lastX, lastY, p.x, p.y);
    lastX = p.x; lastY = p.y;
  }
}

function onPointerEnd(e) {
  if (e.pointerType === "touch") return;
  if (mode === "draw") {
    saveState();
    mode = null;
    activeCanvas = null;
    activeCtx = null;
  }
}

// --- 指(Touch Events)。1本=描画、2本以上=パン ---
function onTouchStart(e, canvasEl) {
  e.preventDefault();
  const touches = e.targetTouches; // このcanvasEl上で現在触れている指のみ

  if (touches.length >= 2) {
    // 2本目の指が触れた → パンに切り替える(描画中だった場合はそこで打ち切り)
    touchMode = "pan";
    const t = touches[touches.length - 1];
    panTouchId = t.identifier;
    panLastClientX = t.clientX;
    touchActiveCanvas = null;
    touchActiveCtx = null;
    return;
  }

  touchMode = "draw";
  const t = touches[0];
  drawTouchId = t.identifier;
  touchActiveCanvas = canvasEl;
  touchActiveCtx = canvasEl.getContext("2d");
  const p = getPos(t.clientX, t.clientY, canvasEl);
  touchLastX = p.x; touchLastY = p.y;
}

function onTouchMove(e, canvasEl) {
  e.preventDefault();
  if (touchMode === "pan") {
    const t = touchListFind(e.targetTouches, panTouchId);
    if (!t) return;
    const delta = t.clientX - panLastClientX;
    scrollWrap.scrollLeft -= delta;
    panLastClientX = t.clientX;
    return;
  }
  if (touchMode === "draw" && touchActiveCtx) {
    const t = touchListFind(e.targetTouches, drawTouchId);
    if (!t) return;
    const p = getPos(t.clientX, t.clientY, touchActiveCanvas);
    strokeLine(touchActiveCtx, touchLastX, touchLastY, p.x, p.y);
    touchLastX = p.x; touchLastY = p.y;
  }
}

function resetTouchGesture() {
  touchMode = null;
  drawTouchId = null;
  panTouchId = null;
  touchActiveCanvas = null;
  touchActiveCtx = null;
}

function onTouchEnd(e, canvasEl) {
  if (touchMode === "pan" && touchListFind(e.changedTouches, panTouchId)) {
    resetTouchGesture();
    return;
  }
  if (touchMode === "draw" && touchListFind(e.changedTouches, drawTouchId)) {
    saveState();
    resetTouchGesture();
  }
}

function onTouchCancel(e, canvasEl) {
  // 割り込み(電話着信など)発生時は状態をリセットするだけにする(念のためsaveStateはしない)
  resetTouchGesture();
}

// -----------------------------------------------------------------
// IndexedDBへの保存・復元(各ページをPNGビットマップとして保存する簡易方式)
// -----------------------------------------------------------------
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveState() {
  try {
    const pageBlobs = [];
    for (const p of pages) {
      const blob = await new Promise(res => p.canvas.toBlob(res, "image/png"));
      pageBlobs.push(blob);
    }
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({ blockIndex, pageBlobs, savedAt: Date.now() }, STATE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error("[TPU-MINI handwriting] saveState failed:", err);
  }
}

async function loadState() {
  try {
    const db = await openDb();
    const rec = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(STATE_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (rec && rec.pageBlobs && rec.pageBlobs.length > 0) {
      for (let i = 0; i < rec.pageBlobs.length; i++) {
        const { ctx } = createPageCanvas(i);
        const bitmap = await createImageBitmap(rec.pageBlobs[i]);
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(bitmap, 0, 0);
        ctx.restore();
      }
      blockIndex = rec.blockIndex || 0;
      updateBlockCountLabel();
      return;
    }
  } catch (err) {
    console.error("[TPU-MINI handwriting] loadState failed:", err);
  }
  // 保存データが無ければ1ページ目だけ用意しておく
  createPageCanvas(0);
  blockIndex = 0;
  updateBlockCountLabel();
}

async function startNew() {
  if (!confirm("現在の記録をクリアして新しいシートを開始します。よろしいですか?")) return;
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(STATE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error("[TPU-MINI handwriting] startNew delete failed:", err);
  }
  pagesRow.innerHTML = "";
  pages = [];
  createPageCanvas(0);
  blockIndex = 0;
  updateBlockCountLabel();
  resetWheelCollector();
  scrollWrap.scrollLeft = 0;
}

// -----------------------------------------------------------------
// GASへの送信(画像のみ。全ページを1枚に結合してbase64でPOST)
// -----------------------------------------------------------------
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const s = reader.result;
      resolve(s.substring(s.indexOf(",") + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// 全ページのCanvasを横に並べた1枚の画像に結合する。
// ★結合用Canvasはdpr=1固定で書き出す(ページ数が多い場合でもCanvasサイズ上限に
//   近づきにくくするため。PCで内容確認する用途なので解像度はこれで十分)。
async function buildCombinedBlob() {
  const n = pages.length;
  const exportDpr = 1;
  const tmp = document.createElement("canvas");
  tmp.width = Math.round(PAGE_W_CSS * n * exportDpr);
  tmp.height = Math.round(PAGE_H_CSS * exportDpr);
  const tctx = tmp.getContext("2d");
  tctx.fillStyle = "#ffffff";
  tctx.fillRect(0, 0, tmp.width, tmp.height);
  for (let i = 0; i < n; i++) {
    const src = pages[i].canvas;
    tctx.drawImage(
      src, 0, 0, src.width, src.height,
      Math.round(i * PAGE_W_CSS * exportDpr), 0,
      Math.round(PAGE_W_CSS * exportDpr), Math.round(PAGE_H_CSS * exportDpr)
    );
  }
  return new Promise(res => tmp.toBlob(res, "image/png"));
}

async function sendToGas() {
  const statusEl = el("sendStatus");
  if (pages.length === 0) {
    statusEl.textContent = "まだ記録がありません。";
    return;
  }
  statusEl.textContent = "画像を書き出し中...";
  try {
    const blob = await buildCombinedBlob();
    const base64 = await blobToBase64(blob);
    const payload = {
      type: "handwriting",
      timestamp: new Date().toISOString(),
      imageBase64: base64,
    };
    statusEl.textContent = "送信中...";
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    statusEl.textContent = `送信完了 (HTTP ${res.status}) ${new Date().toLocaleTimeString("ja-JP")}`;
    console.log("[TPU-MINI handwriting] sent to GAS, status:", res.status);
  } catch (err) {
    statusEl.textContent = "送信失敗: " + err.message;
    console.error("[TPU-MINI handwriting] GAS send failed:", err);
  }
}

// -----------------------------------------------------------------
// BLE接続(通常モードと同じ接続処理)
// -----------------------------------------------------------------
function setConnected(connected) {
  const statusEl = el("connStatus");
  if (connected) {
    statusEl.textContent = "接続中";
    statusEl.className = "status connected";
    el("connectBtn").textContent = "切断";
  } else {
    statusEl.textContent = "未接続";
    statusEl.className = "status disconnected";
    el("connectBtn").textContent = "接続";
    el("liveInfo").textContent = "--.- kPa / MODE: -";
  }
}

async function connect() {
  if (!navigator.bluetooth) {
    alert("このブラウザはWeb Bluetoothに対応していません。");
    return;
  }
  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });
    bleDevice.addEventListener("gattserverdisconnected", () => setConnected(false));

    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService(SERVICE_UUID);

    const liveChar = await service.getCharacteristic(LIVE_CHAR_UUID);
    await liveChar.startNotifications();
    let lastLiveText = "--.-";
    liveChar.addEventListener("characteristicvaluechanged", (e) => {
      lastLiveText = textDecoder.decode(e.target.value);
      el("liveInfo").textContent = `${lastLiveText} kPa / MODE: ${lastKnownModeChar === "A" ? "AUTO" : "MANUAL"}`;
    });

    const confirmedChar = await service.getCharacteristic(CONFIRMED_CHAR_UUID);
    await confirmedChar.startNotifications();
    confirmedChar.addEventListener("characteristicvaluechanged", (e) => {
      const text = textDecoder.decode(e.target.value);
      const kpa = parseFloat(text);
      if (!Number.isNaN(kpa)) onConfirmedValue(kpa);
    });

    const modeChar = await service.getCharacteristic(MODE_CHAR_UUID);
    await modeChar.startNotifications();
    modeChar.addEventListener("characteristicvaluechanged", (e) => {
      lastKnownModeChar = textDecoder.decode(e.target.value);
      el("liveInfo").textContent = `${lastLiveText} kPa / MODE: ${lastKnownModeChar === "A" ? "AUTO" : "MANUAL"}`;
    });
    try {
      const initial = await modeChar.readValue();
      lastKnownModeChar = textDecoder.decode(initial);
    } catch (_) { /* 読めなくても致命的ではない */ }

    setConnected(true);
  } catch (err) {
    console.error(err);
    if (err.name !== "NotFoundError") {
      alert("接続に失敗しました: " + err.message);
    }
  }
}

function disconnect() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
  }
  setConnected(false);
}

// -----------------------------------------------------------------
// 初期化
// -----------------------------------------------------------------
async function init() {
  setupLayout();
  await loadState();

  // ★PC(マウス+トラックパッド/ホイール)での動作確認用。指のネイティブスクロールを
  //   使わない設計にしたため、実機(タブレット)以外ではスクロール手段が無くなって
  //   しまうところを、ホイール操作でも横スクロールできるようにしておく。
  scrollWrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    scrollWrap.scrollLeft += (e.deltaX !== 0 ? e.deltaX : e.deltaY);
  }, { passive: false });

  el("connectBtn").addEventListener("click", () => {
    if (bleDevice && bleDevice.gatt.connected) disconnect();
    else connect();
  });
  el("wheelOrder").addEventListener("change", resetWheelCollector);
  el("newBtn").addEventListener("click", startNew);
  el("sendBtn").addEventListener("click", sendToGas);

  resetWheelCollector();
}

init();
</script>
