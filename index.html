<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TPU-MINI 手書きモード</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #111318;
    color: #eee;
  }
  body {
    display: flex;
    flex-direction: column; /* ヘッダー(可変高さ)+Canvas領域(残り全部)を縦積みにする */
  }
  #header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex: 0 0 auto;
    padding: 8px 10px;
    background: #1a1c22;
    border-bottom: 1px solid #2a2d38;
  }
  #header h1 {
    font-size: 14px;
    margin: 0 10px 0 0;
    white-space: nowrap;
  }
  button {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #23262f;
    color: #eee;
  }
  button.primary { background: #2f6fed; border-color: #2f6fed; }
  button.danger { background: #4a2323; border-color: #7a3a3a; }
  button:disabled { opacity: 0.35; }
  select {
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1a1c22;
    color: #eee;
  }
  .status {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status.connected { background: #163d24; color: #4ade80; }
  .status.disconnected { background: #3d1a1a; color: #f87171; }
  #liveInfo {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }
  #pageNav {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  #pageIndicator {
    font-size: 12px;
    color: #ddd;
    min-width: 54px;
    text-align: center;
    white-space: nowrap;
  }
  #sendStatus {
    flex: 0 0 auto;
    font-size: 11px;
    color: #888;
    padding: 4px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #canvasArea {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  #pagesHost {
    position: absolute;
    inset: 0;
  }
  .page-canvas {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
    background: #ffffff; /* Canvas自体は紙のイメージで常に白 */
    touch-action: none;  /* iOSのネイティブスクロール/ズームジェスチャーを無効化し、常に描画に使う */
  }
  .page-canvas.current { display: block; }
  #emptyHint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 14px;
    text-align: center;
    padding: 24px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-box {
    background: #1a1c22;
    border: 1px solid #2a2d38;
    border-radius: 12px;
    padding: 20px;
    width: min(90vw, 360px);
  }
  .modal-box p {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.6;
  }
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-actions button { width: 100%; }
  .photo-view-box {
    background: #1a1c22;
    border: 1px solid #2a2d38;
    border-radius: 12px;
    padding: 14px;
    width: min(92vw, 640px);
  }
  .photo-view-box img {
    display: block;
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 6px;
    margin-bottom: 14px;
    background: #000;
  }
  .photo-view-actions {
    display: flex;
    gap: 8px;
  }
  .photo-view-actions button { flex: 1 1 0; }
</style>
</head>
<body>

<div id="header">
  <h1>TPU-MINI 手書き <span id="buildTag" style="font-size:10px;color:#777;font-weight:normal;"></span></h1>
  <button id="connectBtn" class="primary">接続</button>
  <span id="connStatus" class="status disconnected">未接続</span>
  <span id="liveInfo">--.- kPa / MODE: -</span>
  <select id="wheelOrder">
    <option value="0">FL始点</option>
    <option value="1">FR始点</option>
    <option value="2">RL始点</option>
    <option value="3">RL始点・逆</option>
    <option value="4">RR始点</option>
  </select>
  <button id="unitToggleBtn">kPa</button>
  <div id="pageNav">
    <button id="prevBtn">◀</button>
    <span id="pageIndicator">0/0</span>
    <button id="nextBtn">▶</button>
  </div>
  <button id="newBtn" class="danger">新規</button>
  <button id="sendBtn" class="primary">送信</button>
</div>
<div id="sendStatus"></div>

<div id="canvasArea">
  <div id="pagesHost"></div>
  <div id="emptyHint">BLE接続後、4輪分の測定が完了すると自動で1ページ目が作成されます</div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

<div id="confirmModal" class="modal-overlay">
  <div class="modal-box">
    <p>まだ送信していない記録があります。新規を作成する前に送信しますか?</p>
    <div class="modal-actions">
      <button id="modalSendThenNew" class="primary">送信してから新規</button>
      <button id="modalNewWithoutSend" class="danger">送信せず新規</button>
      <button id="modalCancel">キャンセル</button>
    </div>
  </div>
</div>

<div id="photoViewModal" class="modal-overlay">
  <div class="photo-view-box">
    <img id="photoViewImg" alt="タイヤ写真">
    <div class="photo-view-actions">
      <button id="photoViewRetake" class="danger">撮り直す</button>
      <button id="photoViewClose" class="primary">閉じる</button>
    </div>
  </div>
</div>

<script>
// =================================================================
// TPU-MINI 手書きモード用 Webアプリ(第6版: ページ送り方式+タイヤ写真)
//
// ★通常モード(tpu_mini_app.html、数値のみGAS送信)とは別ファイルとして分離。
//   BLEのUUID・接続処理・測定順テーブルは通常モードと同じものをそのまま流用。
//
// ★これまでの経緯(要約。詳細は過去バージョンのやり取り参照):
//   初版〜第5版は「横スクロールできる1本の帯にブロックを並べていく」方式だった。
//   iPad実機での検証で、(1)巨大な1枚Canvasはサイズ上限で描画自体が壊れる
//   →ページ単位の小さなCanvasに分割して解決、(2)横スクロールと手書きの両方を
//   指に割り当てると、touch-action任せでも指の本数判定(Pointer Events)でも
//   WebKit(iOS Safari/Chrome/Bluefyは全てWebKitベース)で安定しなかった、
//   という2つの問題が続いた。
//
// ★第6版での方針転換(現在の方式):
//   「横スクロールをやめて、ページ送り(◀/▶ボタン)方式にする」という判断により、
//   指の役割は常に描画専用の1つだけになり、スクロール/マルチタッチ判定のロジックが
//   丸ごと不要になった。これによりPointer Events主体のシンプルな実装に戻せる。
//   あわせて「1ページ=1回の4輪測定」という単位に統一(旧「ブロック」概念は廃止し、
//   ページに統合)。ページ中央に田の字の4輪値、その周囲にFL/RL/RR/FR各タイヤの
//   位置に対応した写真エリアを4つ配置するレイアウトに変更した。
//   写真はタブレットのカメラで撮影し、該当エリアの矩形サイズに合わせて
//   (アスペクト比を保ったまま矩形いっぱいに切り抜く「cover」方式で)Canvasへ
//   直接描き込む。描き込み先の矩形自体が小さいため、元写真が高解像度でも
//   結果的に縮小されたサイズで焼き込まれる(=写真ぶんの最終画像サイズは抑えられる)。
//   同じエリアをタップし直すと新しい写真で上書きされ、そのまま「撮り直し」になる。
//
//   ページの新規作成は引き続きBLEで4輪の値が揃ったタイミングのみで行い(手動での
//   ページ追加はない)、作成と同時にそのページへ自動的に表示を切り替える。
//   送信はこれまで通り「全ページを1枚の画像にまとめて、任意のタイミングで送信」を
//   維持し、既存のGAS連携(gas_handwriting_addon.gs)は変更していない。ただし
//   結合方法は横一列の帯ではなく、5列のグリッドに並べる方式に変えた(ページ数が
//   増えると帯が横に際限なく伸びてCanvasサイズ上限やPC側での確認しやすさの面で
//   不利なため)。各ページの左上に通し番号(#1, #2…)を薄く重ねて、どのページかが
//   結合画像だけでも分かるようにしている。
//   「新規」ボタンを押したとき、まだページが1つでもあれば「送信してから新規」
//   「送信せず新規」「キャンセル」の3択の確認ダイアログを出す(送信忘れ防止)。
//
// ★未確認・要実機再確認の項目:
//   - ページ送り方式でのタブレット実機(iPad各ブラウザ・Androidタブレット)での
//     動作(特にページ送りボタンの反応、写真エリアのタップと手書きの誤判定有無)。
//   - タイヤ写真エリアのレイアウト(サイズ・位置)が実機画面で見やすいか。
//   - 写真エリア上に手書きで注記したあと、同じエリアを撮り直すと、その手書き部分は
//     写真に上書きされて消える(写真とインクは同じ1枚のCanvasに焼き込む単純な方式の
//     ため、レイヤー分離はしていない)。撮り直し前提の運用であれば問題ない想定。
//   - ブロック(ページ)上限(50)に達した場合の挙動(警告を出して以降の自動追加を止める)。
//   - 結合画像(5列グリッド)のサイズ・見やすさ。
//
// ★v6.2での変更点:
//   内圧表示をkPa/Barの切替式にした(ヘッダーの[kPa]/[Bar]トグルボタンで切替、
//   同時併記はしない)。kPaは「000.0」(整数3桁0埋め+小数1桁)、Barは「00.00」
//   (整数2桁0埋め+小数2桁、1bar=100kPaで換算)というゼロ埋め固定書式で表示する
//   (formatPressure関数)。あわせて田の字の数値・FL/FR/RL/RRラベルの文字サイズを
//   従来比2倍にし、それに合わせて田の字エリア自体のサイズも拡大した(GRID_RECT)。
//   単位切替時は田の字部分(GRID_CLEAR_RECT)のみを再描画し、写真や手書きインクは
//   一切変更しない。切替状態・各ページの測定値/タイムスタンプはIndexedDBにも
//   保存し、次回起動時に復元される。
// =================================================================

const SERVICE_UUID        = "12345678-1234-5678-1234-56789abcdef0";
const LIVE_CHAR_UUID      = "12345678-1234-5678-1234-56789abcdef1";
const CONFIRMED_CHAR_UUID = "12345678-1234-5678-1234-56789abcdef2";
const MODE_CHAR_UUID      = "12345678-1234-5678-1234-56789abcdef3";

// ★通常モードと同じGAS Web Appをそのまま使う(手書き用のtype="handwriting"分岐は
//   既存doPost()側にgas_handwriting_addon.gsの内容を追記してある前提)。
const GAS_URL = "https://script.google.com/macros/s/AKfycbzVkPtrjLQHoI61LLRGcJu7mJ58D-VdpwrOCB4kXyT_W8gUPw28EHwf2Yksgl8IIH33/exec";

const WHEEL_ORDER_TABLE = [
  ["FL", "RL", "RR", "FR"],
  ["FR", "RR", "RL", "FL"],
  ["RL", "FL", "FR", "RR"],
  ["RL", "RR", "FR", "FL"],
  ["RR", "RL", "FL", "FR"],
];

// ★どのバージョンのファイルを開いているか実機側で見分けられるよう、画面に小さく表示する
//   (「新しいファイルを送ったのに変化がない」という時、古いファイルを開いたままになっていないか
//   確認しやすくするための目印。変更のたびにここを更新する)。
const BUILD_TAG = "v6.2 kPa/Bar切替+文字拡大";

const MAX_PAGES = 50;   // ★1ページ=1回の測定。1セッション最大20〜30回の想定に余裕を持たせた上限(旧MAX_BLOCKSを踏襲)
const COMBINED_COLS = 5; // ★送信用結合画像のグリッド列数

// ★DB名は第5版までの「1画面2ブロック」形式と構造が異なるため、混在を避けて新しい名前にしている。
const DB_NAME = "tpu_mini_handwriting_db_v2";
const STORE_NAME = "state";
const STATE_KEY = "current";

const TAP_MOVE_THRESHOLD = 8; // px(CSS座標)。この範囲内の動きは「タップ」とみなす

const el = (id) => document.getElementById(id);
const textDecoder = new TextDecoder("utf-8");

let bleDevice = null;
let bleServer = null;
let lastKnownModeChar = "A";

let wheelValues = {};
let currentOrderIdx = 0;

let pagesHost;
let dpr = Math.min(window.devicePixelRatio || 1, 2); // ★DPRを最大2までに制限(Canvasサイズ上限対策)
let PAGE_W_CSS = 0, PAGE_H_CSS = 0;
let GRID_RECT = null;
let GRID_CLEAR_RECT = null; // 単位切替時、田の字部分だけ再描画するための余白込みの矩形
let PHOTO_RECTS = null; // { FL:{x,y,w,h}, FR:..., RL:..., RR:... }

let displayUnit = "kPa"; // "kPa" | "bar" ヘッダーのボタンで切替(全ページ共通)

let pages = [];         // pages[i] = { canvas, ctx }
let currentPageIdx = -1;

// --- 描画/写真タップ判定用(Pointer Eventsのみ。マウス/ペン/指すべて共通) ---
let mode = null;               // "draw" | null
let activeCanvas = null, activeCtx = null, activePage = null;
let downX = 0, downY = 0, lastX = 0, lastY = 0, moved = false;
let pendingPhotoTarget = null; // { page, wheel }

function currentWheelOrder() {
  return WHEEL_ORDER_TABLE[parseInt(el("wheelOrder").value, 10)];
}

function resetWheelCollector() {
  wheelValues = {};
  currentOrderIdx = 0;
  currentWheelOrder().forEach(w => wheelValues[w] = null);
}

// -----------------------------------------------------------------
// レイアウトの初期化(1ページ分の寸法・各エリアの矩形を決める。以後変更しない)
// -----------------------------------------------------------------
function setupLayout() {
  pagesHost = el("pagesHost");
  PAGE_W_CSS = Math.max(600, Math.round(window.innerWidth));
  PAGE_H_CSS = Math.max(300, el("canvasArea").clientHeight);

  // ★文字サイズを倍に拡大した際に田の字マスへ収まるよう、初期版(0.34/0.62)より
  //   グリッド枠自体も広めに確保している(その分、周囲のタイヤ写真エリアはやや狭くなる)。
  const gw = PAGE_W_CSS * 0.46;
  const gh = PAGE_H_CSS * 0.70;
  GRID_RECT = { x: (PAGE_W_CSS - gw) / 2, y: (PAGE_H_CSS - gh) / 2, w: gw, h: gh };
  GRID_CLEAR_RECT = {
    x: GRID_RECT.x - 6, y: GRID_RECT.y - 6,
    w: GRID_RECT.w + 12, h: GRID_RECT.h + 12 + 40, // +40は下に書くタイムスタンプ分の余白
  };

  const pw = (PAGE_W_CSS - gw) / 2;
  const ph = PAGE_H_CSS / 2;
  const pad = 14;
  PHOTO_RECTS = {
    FL: { x: pad,                  y: pad,      w: pw - pad * 2, h: ph - pad * 2 },
    FR: { x: PAGE_W_CSS - pw + pad, y: pad,      w: pw - pad * 2, h: ph - pad * 2 },
    RL: { x: pad,                  y: ph + pad, w: pw - pad * 2, h: ph - pad * 2 },
    RR: { x: PAGE_W_CSS - pw + pad, y: ph + pad, w: pw - pad * 2, h: ph - pad * 2 },
  };
}

function paintPageBackground(canvasEl, ctx) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
  ctx.restore();
}

// kPa値を、選択中の単位(kPa/bar)に応じて指定フォーマットの文字列にする。
//   kPa: 000.0(整数部3桁ゼロ埋め+小数1桁)、bar: 00.00(整数部2桁ゼロ埋め+小数2桁、1bar=100kPa換算)
function formatPressure(kpa, unit) {
  if (kpa == null) return "--.-";
  if (unit === "bar") {
    const [intPart, decPart] = (kpa / 100).toFixed(2).split(".");
    return intPart.padStart(2, "0") + "." + decPart;
  }
  const [intPart, decPart] = kpa.toFixed(1).split(".");
  return intPart.padStart(3, "0") + "." + decPart;
}

// ★文字サイズはユーザー要望で従来の約2倍(ラベル12px→22px、値20px→36px)にしている。
function drawGridBox(ctx, values, timestampStr) {
  const r = GRID_RECT;
  ctx.save();
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.beginPath();
  ctx.moveTo(r.x + r.w / 2, r.y);
  ctx.lineTo(r.x + r.w / 2, r.y + r.h);
  ctx.moveTo(r.x, r.y + r.h / 2);
  ctx.lineTo(r.x + r.w, r.y + r.h / 2);
  ctx.stroke();

  const cellW = r.w / 2, cellH = r.h / 2;
  const cells = [
    { label: "FL", cx: r.x + cellW * 0.5, cy: r.y + cellH * 0.5, val: values.FL },
    { label: "FR", cx: r.x + cellW * 1.5, cy: r.y + cellH * 0.5, val: values.FR },
    { label: "RL", cx: r.x + cellW * 0.5, cy: r.y + cellH * 1.5, val: values.RL },
    { label: "RR", cx: r.x + cellW * 1.5, cy: r.y + cellH * 1.5, val: values.RR },
  ];
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  cells.forEach(c => {
    ctx.fillStyle = "#999999";
    ctx.font = "22px sans-serif";
    ctx.fillText(c.label, c.cx, c.cy - 26);
    ctx.fillStyle = "#111111";
    ctx.font = "bold 36px sans-serif";
    ctx.fillText(formatPressure(c.val, displayUnit), c.cx, c.cy + 10);
  });

  ctx.fillStyle = "#666666";
  ctx.font = "16px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const unitSuffix = timestampStr ? `  (${displayUnit})` : "";
  ctx.fillText(timestampStr + unitSuffix, r.x + r.w / 2, r.y + r.h + 26);
  ctx.restore();
}

// 単位(kPa/bar)切替時、田の字部分だけを白で消してから再描画する(周囲の手書き/写真は残す)。
function redrawGridArea(page) {
  const ctx = page.ctx;
  ctx.save();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(GRID_CLEAR_RECT.x, GRID_CLEAR_RECT.y, GRID_CLEAR_RECT.w, GRID_CLEAR_RECT.h);
  ctx.restore();
  drawGridBox(ctx, page.values, page.timestampStr);
}

function setDisplayUnit(unit) {
  displayUnit = unit;
  el("unitToggleBtn").textContent = unit === "bar" ? "Bar" : "kPa";
  pages.forEach(redrawGridArea);
  saveState();
}

function drawPhotoPlaceholder(ctx, label, rect) {
  ctx.save();
  ctx.strokeStyle = "#bbbbbb";
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  ctx.setLineDash([]);
  ctx.fillStyle = "#999999";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label + " タップして撮影", rect.x + rect.w / 2, rect.y + rect.h / 2);
  ctx.restore();
}

function makeCanvasEl() {
  const c = document.createElement("canvas");
  c.className = "page-canvas";
  c.style.width = PAGE_W_CSS + "px";
  c.style.height = PAGE_H_CSS + "px";
  c.width = Math.round(PAGE_W_CSS * dpr);
  c.height = Math.round(PAGE_H_CSS * dpr);
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  pagesHost.appendChild(c);
  return { canvas: c, ctx };
}

function freshPhotoFilledState() {
  return { FL: false, FR: false, RL: false, RR: false };
}

// まだ測定値が無い空のページを1枚作る(アプリ起動直後や「新規」直後に用意しておく)。
// BLE接続前でも手書き/写真だけ先に試せるようにするための土台で、値は「--.-」表示のまま。
// これ自体は測定1回分としてカウントしない(BLEで4輪揃うと別途createMeasuredPageで
// 新しいページが追加される。このページは車番・注記などの自由記入用としても使える)。
function createEmptyPage() {
  const { canvas, ctx } = makeCanvasEl();
  const values = { FL: null, FR: null, RL: null, RR: null };
  const timestampStr = "";
  paintPageBackground(canvas, ctx);
  drawGridBox(ctx, values, timestampStr);
  ["FL", "FR", "RL", "RR"].forEach(w => drawPhotoPlaceholder(ctx, w, PHOTO_RECTS[w]));
  const page = { canvas, ctx, photoFilled: freshPhotoFilledState(), values, timestampStr };
  attachInputHandlers(canvas, page);
  pages.push(page);
  return page;
}

// BLE確定の4輪値から新しいページを1枚作る(=1回の測定)。
// 元のkPa値(values)とタイムスタンプはページに保持しておき、後で単位(kPa/bar)を
// 切り替えた時に田の字部分だけ再描画できるようにする。
function createMeasuredPage(values, timestampStr) {
  const { canvas, ctx } = makeCanvasEl();
  paintPageBackground(canvas, ctx);
  drawGridBox(ctx, values, timestampStr);
  ["FL", "FR", "RL", "RR"].forEach(w => drawPhotoPlaceholder(ctx, w, PHOTO_RECTS[w]));
  const page = { canvas, ctx, photoFilled: freshPhotoFilledState(), values, timestampStr };
  attachInputHandlers(canvas, page);
  pages.push(page);
  return page;
}

// 復元用: 中身はcreateImageBitmapで丸ごと上書きするので、ここでは器だけ作る。
// photoFilled/values/timestampStrは復元後にloadState側でrec.pageMetaから上書きする。
function createBlankPageForRestore() {
  const { canvas, ctx } = makeCanvasEl();
  const page = {
    canvas, ctx, photoFilled: freshPhotoFilledState(),
    values: { FL: null, FR: null, RL: null, RR: null }, timestampStr: "",
  };
  attachInputHandlers(canvas, page);
  pages.push(page);
  return page;
}

function formatTimestamp(d) {
  const p2 = (n) => String(n).padStart(2, "0");
  return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}

// -----------------------------------------------------------------
// ページ送りナビゲーション
// -----------------------------------------------------------------
function showPage(idx) {
  if (idx < 0 || idx >= pages.length) return;
  if (currentPageIdx >= 0 && pages[currentPageIdx]) {
    pages[currentPageIdx].canvas.classList.remove("current");
  }
  currentPageIdx = idx;
  pages[currentPageIdx].canvas.classList.add("current");
  updatePageIndicator();
  updateNavButtons();
}

function updatePageIndicator() {
  el("pageIndicator").textContent = pages.length ? `${currentPageIdx + 1}/${pages.length}` : "0/0";
  el("emptyHint").style.display = pages.length ? "none" : "flex";
}

function updateNavButtons() {
  el("prevBtn").disabled = currentPageIdx <= 0;
  el("nextBtn").disabled = currentPageIdx >= pages.length - 1;
}

function goPrev() { showPage(currentPageIdx - 1); }
function goNext() { showPage(currentPageIdx + 1); }

function onConfirmedValue(kpa) {
  const order = currentWheelOrder();
  if (currentOrderIdx >= order.length) return;
  const wheel = order[currentOrderIdx];
  wheelValues[wheel] = kpa;
  currentOrderIdx++;
  if (currentOrderIdx >= order.length) {
    if (pages.length >= MAX_PAGES) {
      alert(`本日の上限(${MAX_PAGES}ページ)に達しました。「新規」で次のシートを開始してください。`);
      resetWheelCollector();
      return;
    }
    createMeasuredPage({ ...wheelValues }, formatTimestamp(new Date()));
    showPage(pages.length - 1); // 新規ページへ自動で表示切り替え
    hasContent = true;
    resetWheelCollector();
    saveState();
  }
}

// -----------------------------------------------------------------
// 手書き入力 + タイヤ写真エリアのタップ判定(Pointer Eventsのみ)
//   ページ送り方式にしたことで横スクロールが無くなり、指の役割は常に描画専用の
//   1つだけになった。そのため、以前(第4版・第5版)にあった「指の本数でパンと
//   描画を切り替える」ロジック(Touch Events併用)は不要になったため撤去した。
//   写真エリア内での「タップ(ほぼ動かさない)」はカメラ起動、それ以外の動き
//   (ドラッグ)は通常の手書きとして扱う。判定は移動量(TAP_MOVE_THRESHOLD)で行う。
// -----------------------------------------------------------------
function getPos(clientX, clientY, canvasEl) {
  const rect = canvasEl.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function strokeLine(ctx, x0, y0, x1, y1) {
  ctx.save();
  ctx.strokeStyle = "#111111";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  ctx.restore();
}

function hitTestPhoto(x, y) {
  for (const w of ["FL", "FR", "RL", "RR"]) {
    const r = PHOTO_RECTS[w];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return w;
  }
  return null;
}

function attachInputHandlers(canvasEl, page) {
  canvasEl.addEventListener("pointerdown", (e) => onPointerDown(e, canvasEl, page));
  canvasEl.addEventListener("pointermove", onPointerMove);
  canvasEl.addEventListener("pointerup", onPointerEnd);
  canvasEl.addEventListener("pointercancel", onPointerEnd);
  canvasEl.addEventListener("pointerleave", onPointerEnd);
}

function onPointerDown(e, canvasEl, page) {
  e.preventDefault();
  canvasEl.setPointerCapture(e.pointerId);
  mode = "draw";
  activeCanvas = canvasEl;
  activeCtx = canvasEl.getContext("2d");
  activePage = page;
  const p = getPos(e.clientX, e.clientY, canvasEl);
  downX = p.x; downY = p.y; lastX = p.x; lastY = p.y; moved = false;
}

function onPointerMove(e) {
  if (mode !== "draw" || !activeCtx) return;
  e.preventDefault();
  const p = getPos(e.clientX, e.clientY, activeCanvas);
  if (!moved) {
    if (Math.hypot(p.x - downX, p.y - downY) > TAP_MOVE_THRESHOLD) {
      moved = true;
      strokeLine(activeCtx, downX, downY, p.x, p.y); // 閾値を超えた瞬間、最初の区間も描く
    }
  } else {
    strokeLine(activeCtx, lastX, lastY, p.x, p.y);
  }
  lastX = p.x; lastY = p.y;
}

function onPointerEnd(e) {
  if (mode !== "draw") return;
  if (!moved) {
    const wheel = hitTestPhoto(downX, downY);
    if (wheel) {
      // 撮影済みのエリアは拡大表示(タップのたびに撮り直しになってしまうのを避ける)。
      // 未撮影のエリアはこれまで通りタップで直接カメラを起動する。
      if (activePage.photoFilled[wheel]) openPhotoViewer(activePage, wheel);
      else openCameraFor(activePage, wheel);
    }
  } else {
    hasContent = true;
    saveState();
  }
  mode = null;
  activeCanvas = null; activeCtx = null; activePage = null;
}

// -----------------------------------------------------------------
// タイヤ写真の撮影・合成・拡大表示
// -----------------------------------------------------------------
function openCameraFor(page, wheel) {
  pendingPhotoTarget = { page, wheel };
  el("photoInput").value = ""; // 同じファイルを連続選択してもchangeが発火するようにリセット
  el("photoInput").click();
}

let photoViewTarget = null; // { page, wheel }

// 該当エリアだけをCanvasから切り出して拡大表示する(元写真は保持していないため、
// 既にページCanvasへ焼き込まれたピクセルをそのまま切り出す)。
function openPhotoViewer(page, wheel) {
  const rect = PHOTO_RECTS[wheel];
  const sx = Math.round(rect.x * dpr), sy = Math.round(rect.y * dpr);
  const sw = Math.round(rect.w * dpr), sh = Math.round(rect.h * dpr);
  const tmp = document.createElement("canvas");
  tmp.width = sw; tmp.height = sh;
  tmp.getContext("2d").drawImage(page.canvas, sx, sy, sw, sh, 0, 0, sw, sh);
  el("photoViewImg").src = tmp.toDataURL("image/png");
  photoViewTarget = { page, wheel };
  el("photoViewModal").style.display = "flex";
}

function closePhotoViewer() {
  el("photoViewModal").style.display = "none";
  photoViewTarget = null;
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像の読み込みに失敗しました")); };
    img.src = url;
  });
}

// 矩形いっぱいに「cover」方式(アスペクト比維持のまま中央を切り抜き)で描き込む。
// 描画先の矩形自体が小さいため、元写真が高解像度でもここで実質的に縮小される。
async function drawPhotoIntoPage(page, wheel, file) {
  const img = await loadImageFromFile(file);
  const rect = PHOTO_RECTS[wheel];
  const ctx = page.ctx;
  const scale = Math.max(rect.w / img.width, rect.h / img.height);
  const sw = rect.w / scale, sh = rect.h / scale;
  const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;

  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, sx, sy, sw, sh, rect.x, rect.y, rect.w, rect.h); // 矩形を隙間なく埋めるので、古いプレースホルダーは完全に上書きされる
  ctx.strokeStyle = "#333333";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.shadowColor = "rgba(0,0,0,0.7)";
  ctx.shadowBlur = 3;
  ctx.fillText(wheel, rect.x + 4, rect.y + 4);
  ctx.restore();
  page.photoFilled[wheel] = true;
}

el("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  const target = pendingPhotoTarget;
  pendingPhotoTarget = null;
  if (!file || !target) return;
  try {
    await drawPhotoIntoPage(target.page, target.wheel, file);
    hasContent = true;
    saveState();
  } catch (err) {
    console.error("[TPU-MINI handwriting] photo draw failed:", err);
    alert("写真の読み込みに失敗しました: " + err.message);
  }
});

// -----------------------------------------------------------------
// IndexedDBへの保存・復元(各ページをPNGビットマップとして保存する簡易方式)
// -----------------------------------------------------------------
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveState() {
  try {
    const pageBlobs = [];
    const pageMeta = [];
    for (const p of pages) {
      const blob = await new Promise(res => p.canvas.toBlob(res, "image/png"));
      pageBlobs.push(blob);
      pageMeta.push({ photoFilled: p.photoFilled, values: p.values, timestampStr: p.timestampStr });
    }
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({ pageBlobs, pageMeta, currentPageIdx, hasContent, displayUnit, savedAt: Date.now() }, STATE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error("[TPU-MINI handwriting] saveState failed:", err);
  }
}

async function loadState() {
  try {
    const db = await openDb();
    const rec = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(STATE_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (rec && rec.pageBlobs && rec.pageBlobs.length > 0) {
      for (let i = 0; i < rec.pageBlobs.length; i++) {
        const page = createBlankPageForRestore();
        const bitmap = await createImageBitmap(rec.pageBlobs[i]);
        page.ctx.save();
        page.ctx.setTransform(1, 0, 0, 1, 0, 0);
        page.ctx.drawImage(bitmap, 0, 0);
        page.ctx.restore();
        const meta = rec.pageMeta && rec.pageMeta[i];
        if (meta && meta.photoFilled) page.photoFilled = meta.photoFilled;
        if (meta && meta.values) page.values = meta.values;
        if (meta && meta.timestampStr !== undefined) page.timestampStr = meta.timestampStr;
      }
      const restoreIdx = Math.min(Math.max(0, rec.currentPageIdx ?? 0), pages.length - 1);
      showPage(restoreIdx);
      hasContent = rec.hasContent !== undefined ? rec.hasContent : pages.length > 1;
      if (rec.displayUnit) {
        displayUnit = rec.displayUnit;
        el("unitToggleBtn").textContent = displayUnit === "bar" ? "Bar" : "kPa";
      }
      return;
    }
  } catch (err) {
    console.error("[TPU-MINI handwriting] loadState failed:", err);
  }
  // 保存データが無ければ、測定前でも試せるよう空のページを1枚用意しておく
  createEmptyPage();
  showPage(0);
}

// 「新規」時に送信忘れ確認ダイアログを出すかどうかの判定用。
// 起動直後に用意される空ページ(createEmptyPage)だけの状態では警告を出したくないため、
// 単純なpages.length>0ではなく、実際に何か記入された(測定・手書き・写真)かどうかを見る。
let hasContent = false;

function hasUnsentContent() {
  return hasContent;
}

async function clearAllAndStartFresh() {
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(STATE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error("[TPU-MINI handwriting] clearAllAndStartFresh delete failed:", err);
  }
  pagesHost.innerHTML = "";
  pages = [];
  currentPageIdx = -1;
  hasContent = false;
  createEmptyPage();
  showPage(0);
  resetWheelCollector();
  el("sendStatus").textContent = "";
}

function showConfirmModal() { el("confirmModal").style.display = "flex"; }
function hideConfirmModal() { el("confirmModal").style.display = "none"; }

async function onNewBtnClick() {
  if (!hasUnsentContent()) {
    await clearAllAndStartFresh();
    return;
  }
  showConfirmModal();
}

// -----------------------------------------------------------------
// GASへの送信(画像のみ。全ページを5列グリッドの1枚に結合してbase64でPOST)
// -----------------------------------------------------------------
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const s = reader.result;
      resolve(s.substring(s.indexOf(",") + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ★横一列の帯だとページ数が増えるほど際限なく横長になる(Canvasサイズ上限や
//   PC側での確認しやすさの面で不利)ため、5列のグリッドに並べて結合する。
async function buildCombinedBlob() {
  const n = pages.length;
  const cols = Math.min(COMBINED_COLS, n) || 1;
  const rows = Math.ceil(n / cols);
  const exportDpr = 1; // 結合用Canvasはdpr=1固定で書き出す(PC確認用途なので解像度はこれで十分)
  const cw = Math.round(PAGE_W_CSS * exportDpr);
  const ch = Math.round(PAGE_H_CSS * exportDpr);

  const tmp = document.createElement("canvas");
  tmp.width = cw * cols;
  tmp.height = ch * rows;
  const tctx = tmp.getContext("2d");
  tctx.fillStyle = "#ffffff";
  tctx.fillRect(0, 0, tmp.width, tmp.height);

  for (let i = 0; i < n; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const src = pages[i].canvas;
    const dx = col * cw, dy = row * ch;
    tctx.drawImage(src, 0, 0, src.width, src.height, dx, dy, cw, ch);
    tctx.save();
    tctx.fillStyle = "rgba(0,0,0,0.55)";
    tctx.font = "bold 14px sans-serif";
    tctx.textAlign = "left";
    tctx.textBaseline = "top";
    tctx.fillText(`#${i + 1}`, dx + 6, dy + 6);
    tctx.restore();
  }
  return new Promise(res => tmp.toBlob(res, "image/png"));
}

// 成功したかどうかをbooleanで返す(「送信してから新規」の判断に使うため)
async function sendToGas() {
  const statusEl = el("sendStatus");
  if (pages.length === 0) {
    statusEl.textContent = "まだ記録がありません。";
    return false;
  }
  statusEl.textContent = "画像を書き出し中...";
  try {
    const blob = await buildCombinedBlob();
    const base64 = await blobToBase64(blob);
    const payload = {
      type: "handwriting",
      timestamp: new Date().toISOString(),
      imageBase64: base64,
    };
    statusEl.textContent = "送信中...";
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    statusEl.textContent = `送信完了 (HTTP ${res.status}) ${new Date().toLocaleTimeString("ja-JP")}`;
    console.log("[TPU-MINI handwriting] sent to GAS, status:", res.status);
    return res.ok;
  } catch (err) {
    statusEl.textContent = "送信失敗: " + err.message;
    console.error("[TPU-MINI handwriting] GAS send failed:", err);
    return false;
  }
}

// -----------------------------------------------------------------
// BLE接続(通常モードと同じ接続処理)
// -----------------------------------------------------------------
function setConnected(connected) {
  const statusEl = el("connStatus");
  if (connected) {
    statusEl.textContent = "接続中";
    statusEl.className = "status connected";
    el("connectBtn").textContent = "切断";
  } else {
    statusEl.textContent = "未接続";
    statusEl.className = "status disconnected";
    el("connectBtn").textContent = "接続";
    el("liveInfo").textContent = "--.- kPa / MODE: -";
  }
}

async function connect() {
  if (!navigator.bluetooth) {
    alert("このブラウザはWeb Bluetoothに対応していません。");
    return;
  }
  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });
    bleDevice.addEventListener("gattserverdisconnected", () => setConnected(false));

    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService(SERVICE_UUID);

    const liveChar = await service.getCharacteristic(LIVE_CHAR_UUID);
    await liveChar.startNotifications();
    let lastLiveText = "--.-";
    liveChar.addEventListener("characteristicvaluechanged", (e) => {
      lastLiveText = textDecoder.decode(e.target.value);
      el("liveInfo").textContent = `${lastLiveText} kPa / MODE: ${lastKnownModeChar === "A" ? "AUTO" : "MANUAL"}`;
    });

    const confirmedChar = await service.getCharacteristic(CONFIRMED_CHAR_UUID);
    await confirmedChar.startNotifications();
    confirmedChar.addEventListener("characteristicvaluechanged", (e) => {
      const text = textDecoder.decode(e.target.value);
      const kpa = parseFloat(text);
      if (!Number.isNaN(kpa)) onConfirmedValue(kpa);
    });

    const modeChar = await service.getCharacteristic(MODE_CHAR_UUID);
    await modeChar.startNotifications();
    modeChar.addEventListener("characteristicvaluechanged", (e) => {
      lastKnownModeChar = textDecoder.decode(e.target.value);
      el("liveInfo").textContent = `${lastLiveText} kPa / MODE: ${lastKnownModeChar === "A" ? "AUTO" : "MANUAL"}`;
    });
    try {
      const initial = await modeChar.readValue();
      lastKnownModeChar = textDecoder.decode(initial);
    } catch (_) { /* 読めなくても致命的ではない */ }

    setConnected(true);
  } catch (err) {
    console.error(err);
    if (err.name !== "NotFoundError") {
      alert("接続に失敗しました: " + err.message);
    }
  }
}

function disconnect() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
  }
  setConnected(false);
}

// -----------------------------------------------------------------
// 初期化
// -----------------------------------------------------------------
async function init() {
  el("buildTag").textContent = `(${BUILD_TAG})`;
  console.log("[TPU-MINI handwriting] build:", BUILD_TAG);

  setupLayout();
  await loadState();

  // ★PCではホイール操作でもページ送りできるようにしておく(タブレット実機は
  //   ◀/▶ボタンでの操作が基本)。連続発火しすぎないよう簡易クールダウンを入れる。
  let wheelCooldown = false;
  el("canvasArea").addEventListener("wheel", (e) => {
    e.preventDefault();
    if (wheelCooldown) return;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (delta > 10) goNext();
    else if (delta < -10) goPrev();
    else return;
    wheelCooldown = true;
    setTimeout(() => { wheelCooldown = false; }, 350);
  }, { passive: false });

  el("connectBtn").addEventListener("click", () => {
    if (bleDevice && bleDevice.gatt.connected) disconnect();
    else connect();
  });
  el("wheelOrder").addEventListener("change", resetWheelCollector);
  el("unitToggleBtn").addEventListener("click", () => setDisplayUnit(displayUnit === "kPa" ? "bar" : "kPa"));
  el("prevBtn").addEventListener("click", goPrev);
  el("nextBtn").addEventListener("click", goNext);
  el("newBtn").addEventListener("click", onNewBtnClick);
  el("sendBtn").addEventListener("click", sendToGas);

  el("modalCancel").addEventListener("click", hideConfirmModal);
  el("modalNewWithoutSend").addEventListener("click", async () => {
    hideConfirmModal();
    await clearAllAndStartFresh();
  });
  el("modalSendThenNew").addEventListener("click", async () => {
    hideConfirmModal();
    const ok = await sendToGas();
    if (ok) {
      await clearAllAndStartFresh();
    } else {
      alert("送信に失敗したため、新規は中止しました。もう一度お試しください。");
    }
  });

  el("photoViewClose").addEventListener("click", closePhotoViewer);
  el("photoViewRetake").addEventListener("click", () => {
    const target = photoViewTarget;
    closePhotoViewer();
    if (target) openCameraFor(target.page, target.wheel);
  });

  resetWheelCollector();
}

init();
</script>
